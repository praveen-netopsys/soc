<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Grid -->
  <rect width="600" height="600" fill="#0b0f19"/>
  <circle cx="300" cy="300" r="280" fill="url(#meshCenter)"/>
  <!-- Concentric Gravitational Funnel Lines -->
  <ellipse cx="300" cy="300" rx="260" ry="110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <ellipse cx="300" cy="330" rx="200" ry="85" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="300" cy="360" rx="140" ry="60" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.8"/>
  <ellipse cx="300" cy="390" rx="80" ry="35" fill="none" stroke="#818cf8" stroke-width="3.5" opacity="0.9"/>
  <!-- Radial Funnel Rays Warping Inward -->
  <path d="M 40,300 Q 200,320 280,410" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 560,300 Q 400,320 320,410" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 300,190 L 300,410" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <!-- Central Mass Sphere -->
  <circle cx="300" cy="360" r="45" fill="#f59e0b"/>
  <circle cx="285" cy="345" r="12" fill="#fef3c7" opacity="0.8"/>
</svg>
