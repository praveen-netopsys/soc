<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oceanSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#earthGlow)"/>
  <circle cx="250" cy="250" r="180" fill="url(#oceanSphere)"/>
  <!-- Continent contours -->
  <path d="M 210,140 Q 230,120 270,130 Q 300,160 290,190 Q 260,220 220,190 Z" fill="#22c55e" opacity="0.85"/>
  <path d="M 240,220 Q 270,250 250,310 Q 220,330 200,280 Q 210,240 240,220 Z" fill="#16a34a" opacity="0.85"/>
  <path d="M 140,180 Q 180,160 170,210 Q 130,220 140,180 Z" fill="#22c55e" opacity="0.8"/>
  <!-- Atmosphere limb -->
  <circle cx="250" cy="250" r="180" stroke="#bae6fd" stroke-width="4" fill="none" opacity="0.6"/>
</svg>
