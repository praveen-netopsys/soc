<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Flame Exhaust -->
  <polygon points="230,360 250,470 270,360" fill="url(#flameGrad)"/>
  <polygon points="240,360 250,430 260,360" fill="#ffffff" opacity="0.9"/>
  <!-- Fins -->
  <polygon points="210,320 160,370 210,360" fill="#ef4444"/>
  <polygon points="290,320 340,370 290,360" fill="#ef4444"/>
  <!-- Fuselage -->
  <path d="M 250,90 Q 210,180 210,360 L 290,360 Q 290,180 250,90 Z" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
  <!-- Cockpit Window -->
  <circle cx="250" cy="180" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="245" cy="175" r="5" fill="#ffffff" opacity="0.8"/>
  <!-- Red Stripe -->
  <rect x="210" y="270" width="80" height="15" fill="#ef4444"/>
</svg>
