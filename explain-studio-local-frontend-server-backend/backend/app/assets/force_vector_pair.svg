<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Mass 1 -->
  <circle cx="120" cy="150" r="50" fill="#38bdf8"/>
  <circle cx="105" cy="135" r="14" fill="#ffffff" opacity="0.7"/>
  <text x="120" y="157" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">m₁</text>

  <!-- Mass 2 -->
  <circle cx="480" cy="150" r="40" fill="#f59e0b"/>
  <circle cx="468" cy="138" r="10" fill="#ffffff" opacity="0.7"/>
  <text x="480" y="157" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">m₂</text>

  <!-- Distance line -->
  <line x1="120" y1="230" x2="480" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="300" y="255" font-size="18" fill="#cbd5e1" text-anchor="middle">Distance r</text>

  <!-- Force Vector from m1 toward m2 -->
  <line x1="180" y1="150" x2="280" y2="150" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <polygon points="275,140 298,150 275,160" fill="#ec4899"/>
  <text x="240" y="130" font-size="20" font-weight="bold" fill="#ec4899" text-anchor="middle">F₁₂</text>

  <!-- Force Vector from m2 toward m1 -->
  <line x1="430" y1="150" x2="330" y2="150" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <polygon points="335,140 312,150 335,160" fill="#ec4899"/>
  <text x="360" y="130" font-size="20" font-weight="bold" fill="#ec4899" text-anchor="middle">F₂₁</text>
</svg>
